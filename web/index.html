<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f3f5f4"><title>Signal Studio · 科技内容工作台</title><link rel="stylesheet" href="./taste.css"></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M25 7H13a6 6 0 0 0 0 12h6a4 4 0 0 1 0 8H7M7 3v7M25 22v7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>Signal Studio<small>科技内容工作台</small></span></a>
    <div class="workspace"><span class="avatar">科</span><div>我的创作空间<small>行业研究与内容编辑</small></div></div>
    <div class="nav-label">工作空间</div>
    <nav aria-label="主导航"><button class="nav-item active" data-view="library"><span data-icon="articles"></span>文章工作台<i id="nav-count" hidden>0</i></button><button class="nav-item" data-view="materials"><span data-icon="image"></span>素材库</button><button class="nav-item" data-view="deliveries"><span data-icon="send"></span>草稿投递</button><button class="nav-item" data-view="settings"><span data-icon="settings"></span>设置与连接</button></nav>
    <div class="sidebar-note"><strong>研究 → 写作 → 审稿</strong><p>事实有出处，修改有记录。<br>最终发布由你确认。</p><div><span class="tiny-dot"></span>写作 Agent + 审稿 Agent</div></div>
    <div class="sidebar-bottom"><span class="avatar mini">我</span><div>独立创作者<small>本地优先 · 数据由你掌握</small></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><button id="mobile-menu" class="icon-button" aria-label="打开导航" aria-expanded="false" data-icon="menu"></button><div class="breadcrumb">工作空间 <span>/</span> <strong id="crumb">文章工作台</strong></div><div class="topbar-right"><span class="connection"><span class="tiny-dot" id="connection-dot"></span><span id="connection-text">连接中</span></span><button class="icon-button" id="refresh" title="刷新" aria-label="刷新文章与连接" data-icon="refresh"></button></div></header>
    <main id="main"></main>
    <footer>把事实讲清楚，把观点写出来。<span>Signal Studio · v0.1</span></footer>
  </div>
  <dialog id="import-dialog" aria-labelledby="import-title"><form id="import-form"><div class="modal-heading"><h2 id="import-title">导入一个行业信号</h2><p>报道、模型发布或技术论文，都从原始链接开始。</p></div><label>文章来源链接<input name="url" type="url" required placeholder="https://…"></label><details><summary>来源需要登录？手动粘贴原文</summary><label>来源标题<input name="title" placeholder="原始文章标题"></label><label>原始正文<textarea name="text" rows="7" placeholder="粘贴原文（至少 150 字），仍需提供原始链接以记录出处"></textarea></label></details><div class="notice">原文和素材将按文章保存。导入后可选择篇幅与风格，启动写作和审稿。</div><div class="modal-actions"><button type="button" class="button secondary" id="cancel-import">取消</button><button class="button primary" type="submit">导入文章</button></div></form></dialog>
  <dialog id="asset-dialog" aria-labelledby="asset-title"><div class="modal-heading"><h2 id="asset-title">选择一张配图</h2><p>确认授权、无水印的素材可插入或替换正文图片。</p></div><div id="asset-picker" class="asset-grid"></div><div class="modal-actions"><button class="button secondary" id="close-assets">关闭</button></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body></html>
